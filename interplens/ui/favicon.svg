<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <!-- Top highlight plane -->
        <linearGradient id="topFace" x1="8" y1="6" x2="56" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7DD3FC" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
        <!-- Left lit 3D plane -->
        <linearGradient id="leftFace" x1="8" y1="18" x2="32" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
        <!-- Right shaded 3D plane -->
        <linearGradient id="rightFace" x1="32" y1="24" x2="56" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1D4ED8" />
            <stop offset="100%" stop-color="#1E3A8A" />
        </linearGradient>
        <!-- Inner optical core highlight -->
        <linearGradient id="coreLeft" x1="20" y1="12" x2="32" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E0F2FE" />
        </linearGradient>
        <linearGradient id="coreRight" x1="32" y1="12" x2="44" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#BAE6FD" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
    </defs>

    <!-- Bottom 3D Isometric Prism Base (Left & Right Shaded Faces) -->
    <polygon points="10,33 32,45.5 32,60 10,47.5" fill="url(#leftFace)" />
    <polygon points="54,33 32,45.5 32,60 54,47.5" fill="url(#rightFace)" />
    <!-- Bottom Slab Inner Top Rim (gives floating 3D separation depth) -->
    <polygon points="32,20.5 54,33 32,45.5 10,33" fill="#0F172A" fill-opacity="0.35" />

    <!-- Top Floating 3D Isometric Lens Slab -->
    <!-- Top Diamond Plane -->
    <polygon points="32,4 56,17.5 32,31 8,17.5" fill="url(#topFace)" />
    <!-- Left Extruded Edge -->
    <polygon points="8,17.5 32,31 32,39.5 8,26" fill="#2563EB" />
    <!-- Right Extruded Edge -->
    <polygon points="56,17.5 32,31 32,39.5 56,26" fill="#1E40AF" />

    <!-- Sculpted 3D Optical Core Aperture inlaid in Top Plane -->
    <polygon points="32,10.5 20.5,17.5 32,24.5" fill="url(#coreLeft)" />
    <polygon points="32,10.5 43.5,17.5 32,24.5" fill="url(#coreRight)" />
</svg>
