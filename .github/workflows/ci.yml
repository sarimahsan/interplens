name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -e .[all,dev] pytest-cov

      - name: Verify Package Metadata & Imports
        run: |
          python -c "import interplens as il; print('InterpLens version:', il.__version__)"
          python -c "import interplens.adapters, interplens.analysis, interplens.server, interplens.utils; print('Core submodules imported successfully')"

      - name: Run Pytest Suite
        run: |
          pytest -k "not gpt2_integration" --cov=interplens --cov-report=xml

      - name: Upload Coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
