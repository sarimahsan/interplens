name: 🐛 Bug Report
description: Report unexpected behavior, crashes, or model hook errors in InterpLens
labels: [ "bug", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue already exists.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal Python script or CLI command to reproduce the issue.
      placeholder: |
        ```python
        import interplens as il
        il.launch(model_name="...")
        ```
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback / Terminal Output
      description: Paste the complete error traceback here.
      placeholder: |
        ```text
        Traceback (most recent call last):
          ...
        ```
      render: text

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Python version, PyTorch version, OS, GPU/Device (e.g. Python 3.13, PyTorch 2.5, Windows 11, CUDA 12.4).
      placeholder: "Python 3.13.1, PyTorch 2.5.0, Ubuntu 24.04, RTX 4090"
    validations:
      required: true
