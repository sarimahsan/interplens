[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interplens"
version = "0.1.0"
description = "An interactive mechanistic interpretability toolkit and visual debugger for LLM internals."
readme = "README.md"
authors = [
    { name = "InterpLens Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformer-lens>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "einops>=0.6.0",
    "jaxtyping>=0.2.0",
    "scikit-learn>=1.2.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
interplens = "interplens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["interplens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
