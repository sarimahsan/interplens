<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#090D16" />
        </linearGradient>
        <linearGradient id="ringGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="55%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#A855F7" />
        </linearGradient>
        <linearGradient id="beamGrad" x1="16" y1="32" x2="48" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
    </defs>

    <!-- Crisp App Icon Squircle -->
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />

    <!-- Precision Optical Lens Ring -->
    <circle cx="32" cy="32" r="19" stroke="url(#ringGrad)" stroke-width="3.5" />

    <!-- Residual Stream Circuit Path Through Lens -->
    <path d="M16 36 L26 26 L38 38 L48 28" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Circuit Focal Nodes -->
    <circle cx="26" cy="26" r="3.5" fill="#38BDF8" />
    <circle cx="38" cy="38" r="3.5" fill="#A855F7" />
    <circle cx="32" cy="32" r="2.2" fill="#F8FAFC" />
</svg>
