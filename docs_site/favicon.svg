<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="50%" stop-color="#818CF8" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
        <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background Lens Orb -->
    <rect width="64" height="64" rx="16" fill="#0A0F1E" stroke="url(#lensGrad)" stroke-width="2" />
    
    <!-- Transformer Layers Core Symbol -->
    <g filter="url(#glow)">
        <!-- Top Transformer Layer -->
        <polygon points="32 10 52 20 32 30 12 20" fill="url(#lensGrad)" fill-opacity="0.9" stroke="#E0F2FE" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Middle Residual Highway Layer -->
        <polyline points="12 32 32 42 52 32" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Bottom Attention & MLP Layer -->
        <polyline points="12 44 32 54 52 44" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Central Lens Focal Dot -->
    <circle cx="32" cy="20" r="3" fill="#FFFFFF" />
</svg>
